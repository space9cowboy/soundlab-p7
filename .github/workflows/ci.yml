# Intégration continue minimale de soundlab-p7 :
#   1. tests : pytest sur tests/ (Python 3.11, dépendances de requirements/test.txt)
#      Les tests Spark p7_01 / p7_02 ne sont pas collectés par pytest (noms hors test_*.py) : hors CI.
#   2. images : construction de toutes les images déclarées dans docker-compose, puis de l'image Render
# Aucun secret n'est utilisé ni publié : les images sont construites, jamais poussées vers un registre.
# POSTGRES_PASSWORD reçoit une valeur factice, uniquement pour que Compose résolve sa configuration.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt

      - name: pytest
        run: pytest -q tests/

  images:
    name: Construction des images Docker
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-valeur-factice-non-secrete
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Images de docker-compose (tous profils)
        run: |
          docker compose --profile "*" config --services
          docker compose --profile "*" build

      - name: Image de déploiement Render
        run: docker build -f deploy/render/Dockerfile -t soundlab-api-render:ci .

      - name: Inventaire
        run: docker image ls --format '{{.Repository}}:{{.Tag}}  {{.Size}}'
