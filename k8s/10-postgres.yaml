apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: soundlab}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: mlflow}
            - {name: POSTGRES_USER, value: mlflow}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: soundlab-postgres, key: POSTGRES_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "mlflow", "-d", "mlflow"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: donnees, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: donnees}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: soundlab}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
