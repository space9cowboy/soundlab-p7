apiVersion: v1
kind: ConfigMap
metadata: {name: api-config, namespace: soundlab}
data:
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MODELE_URI: models:/soundlab-hit@champion
  CORS_ORIGINES: http://localhost:3000
  PORT: "8000"
  HOME: /tmp
  RECHARGEMENT_S: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: soundlab}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: soundlab-api:1.0
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: api-config}}]
          ports: [{containerPort: 8000}]
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 1536Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: soundlab}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: soundlab}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: api}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api, namespace: soundlab}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 60}
